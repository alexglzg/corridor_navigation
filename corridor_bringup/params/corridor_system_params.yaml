# For bicycle modified
corridor_planner:
  ros__parameters:
    v_max: 1.0
    robot_delta_max: 0.785 #pi/4
    robot_width: 0.1
    robot_length: 0.1
    robot_wheelbase: 0.2 # R = L/tan(delta_max) = 0.2/tan(pi/4) = 0.2
    model_type: "bicycle"
    sampling_dt: 0.100
    map_frame: "map"